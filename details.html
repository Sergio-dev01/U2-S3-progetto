<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dettaglio Prodotto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container my-5 d-flex flex-column align-items-center">
      <h1 class="mb-4" id="productName">Dettaglio prodotto</h1>
      <div class="card" style="max-width: 400px">
        <img id="productImage" class="card-img-top h-100" alt="immagine prodotto" />
        <div class="card-body">
          <h5 class="card-title" id="productBrand"></h5>
          <p class="card-text" id="productDescription"></p>
          <div class="">
            <p class="card-text fw-bold" style="color: rgb(90, 89, 89)">Prezzo: €<span id="productPrice"></span></p>
          </div>
          <div class="d-flex flex-column align-items-center">
            <a href="index.html" class="btn btn-primary mt-3">Torna alla Home</a>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/details.js"></script>
  </body>
</html>
