<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backoffice - Gestione Prodotti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container mt-5">
      <h1 id="formTitle" class="mb-5">Crea un nuovo prodotto</h1>
      <form id="productForm">
        <div class="mb-3">
          <label class="form-label">Nome</label>
          <input type="text" class="form-control" id="name" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Descrizione</label>
          <textarea class="form-control" id="description" required></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Brand</label>
          <input type="text" class="form-control" id="brand" required />
        </div>
        <div class="mb-3">
          <label class="form-label">URL Immagine</label>
          <input type="url" class="form-control" id="imageUrl" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Prezzo</label>
          <input type="number" class="form-control" id="price" required />
        </div>
        <button type="submit" class="btn btn-success">Salva</button>
        <button type="reset" id="resetBtn" class="btn btn-warning">Reset</button>
        <button type="button" id="deleteBtn" class="btn btn-danger d-none">Elimina prodotto</button>
        <button type="button" id="backToHomeBtn" class="btn btn-secondary d-none">Torna alla Home</button>
      </form>
    </div>

    <script src="./js/backoffice.js"></script>
  </body>
</html>
