<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backoffice - Gestione Prodotti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <nav class="navbar bg-dark navbar-dark fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" class="me-2" style="height: 32px; width: auto; fill: currentColor">
            <path
              d="M36.8 192l566.3 0c20.3 0 36.8-16.5 36.8-36.8c0-7.3-2.2-14.4-6.2-20.4L558.2 21.4C549.3 8 534.4 0 518.3 0L121.7 0c-16 0-31 8-39.9 21.4L6.2 134.7c-4 6.1-6.2 13.2-6.2 20.4C0 175.5 16.5 192 36.8 192zM64 224l0 160 0 80c0 26.5 21.5 48 48 48l224 0c26.5 0 48-21.5 48-48l0-80 0-160-64 0 0 160-192 0 0-160-64 0zm448 0l0 256c0 17.7 14.3 32 32 32s32-14.3 32-32l0-256-64 0z"
            />
          </svg>
          Shop Online-Reserved Area
        </a>
      </div>
    </nav>
    <div class="container mt-5">
      <h1 id="formTitle" class="mb-4">Gestione dei prodotti</h1>
      <form id="productForm">
        <div class="mb-3">
          <label class="form-label">Nome</label>
          <input type="text" class="form-control" id="name" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Descrizione</label>
          <textarea class="form-control" id="description" required></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Brand</label>
          <input type="text" class="form-control" id="brand" required />
        </div>
        <div class="mb-3">
          <label class="form-label">URL Immagine</label>
          <input type="url" class="form-control" id="imageUrl" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Prezzo</label>
          <input type="number" class="form-control" id="price" required />
        </div>
        <button type="submit" class="btn btn-success">Salva</button>
        <button type="reset" id="resetBtn" class="btn btn-warning">Reset</button>
        <button type="button" id="deleteBtn" class="btn btn-danger d-none">Elimina prodotto</button>
        <button type="button" id="backToHomeBtn" class="btn btn-secondary d-none">Torna alla Home</button>
      </form>
    </div>

    <script src="./js/backoffice.js"></script>
  </body>
</html>
